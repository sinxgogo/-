<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f3">
  <meta name="description" content="港币兑人民币汇率观察与目标汇率提醒">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>港币汇率提醒</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="港币汇率提醒首页">
        <span class="brand-mark" aria-hidden="true">HK<span>→</span>CN</span>
        <span class="brand-name">汇率观察</span>
      </a>
      <button class="icon-button" id="refreshButton" type="button" aria-label="刷新汇率" title="刷新汇率">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4.9 9A7.5 7.5 0 0 1 18 6.5L20 12M4 17v-5h5m10.1 3A7.5 7.5 0 0 1 6 17.5L4 12"/></svg>
      </button>
    </header>

    <section class="rate-panel" id="top" aria-labelledby="rateHeading">
      <div class="panel-meta">
        <div>
          <p class="eyebrow">实时参考汇率</p>
          <h1 id="rateHeading">港币 <span class="pair-arrow">/</span> 人民币</h1>
        </div>
        <span class="market-status"><span class="status-dot"></span><span id="marketLabel">正在获取</span></span>
      </div>
      <div class="rate-line">
        <div class="rate-value" id="rateValue" aria-live="polite">--<span> CNY</span></div>
        <div class="rate-unit">1 HKD</div>
      </div>
      <div class="rate-foot">
        <span id="updatedAt">等待首次更新</span>
        <span class="change-value" id="changeValue">近 7 日 --</span>
      </div>
      <div class="rate-track" aria-hidden="true"><span id="rateMarker"></span></div>
      <div class="track-labels"><span>近 7 日低位 <b id="weekLow">--</b></span><span>高位 <b id="weekHigh">--</b></span></div>
    </section>

    <section class="target-section" aria-labelledby="targetHeading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">你的兑换计划</p>
          <h2 id="targetHeading">达到目标时提醒我</h2>
        </div>
        <label class="switch" title="开启或暂停汇率提醒">
          <input id="alertEnabled" type="checkbox" checked aria-label="开启汇率提醒">
          <span class="switch-track"></span>
        </label>
      </div>
      <div class="target-form">
        <label class="target-input-wrap" for="targetRate">
          <span>目标汇率</span>
          <span class="input-row"><input id="targetRate" type="number" min="0.01" max="99" step="0.0001" inputmode="decimal" placeholder="例如 0.93"><b>CNY</b></span>
        </label>
        <button class="primary-button" id="saveTarget" type="button">保存目标</button>
      </div>
      <p class="target-hint" id="targetHint">汇率达到或高于目标时提醒。目标越高，收到提醒的机会越多。</p>
    </section>

    <section class="notice-section" aria-labelledby="noticeHeading">
      <div class="notice-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
      </div>
      <div class="notice-copy">
        <h2 id="noticeHeading">提醒状态</h2>
        <p id="noticeStatus">打开通知权限，汇率达到目标时通知你。</p>
      </div>
      <button class="text-button" id="enableNotifications" type="button">开启通知</button>
    </section>

    <section class="details-section" aria-label="汇率信息">
      <div class="detail-row"><span>数据来源</span><b>Frankfurter · ECB 参考价</b></div>
      <div class="detail-row"><span>自动检查</span><b id="checkStatus">应用打开时每小时检查</b></div>
      <div class="detail-row"><span>提醒方式</span><b id="deliveryStatus">本机通知</b></div>
    </section>
    <footer>汇率为参考价，银行及兑换机构的实际成交价可能不同。</footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
